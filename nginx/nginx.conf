worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Docker's embedded DNS. Using variables in proxy_pass (below) makes nginx
    # re-resolve upstream container names at request time, so recreating the
    # api/client/mcp-server containers (new IPs) no longer causes stale 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        client_max_body_size 100m;

        location /api/ {
            set $api http://api:8080;
            proxy_pass         $api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location /mcp/ {
            set $mcp http://mcp-server:3001;
            rewrite ^/mcp/(.*)$ /$1 break;
            proxy_pass         $mcp;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   Connection '';
            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
        }

        location / {
            set $client http://client:80;
            proxy_pass         $client;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }
}
