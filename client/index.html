<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Vexora — AI-native attack surface reconnaissance and bug bounty framework." />
    <meta name="author" content="Spondon Saha" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Vexora</title>
    <style>
      html,
      body {
        background-color: #0a0d12;
      }
      html.light,
      html.light body {
        background-color: #f4f5f7;
      }
    </style>
    <script>
      (function () {
        try {
          if (localStorage.getItem('vexora-theme') === 'light') {
            document.documentElement.classList.add('light')
          }
        } catch (error) {
          /* localStorage unavailable; stay on the default dark theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
